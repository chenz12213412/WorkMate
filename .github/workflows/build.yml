name: WorkMate build

on:
  push:
    branches: [ main, "codex/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WorkMate.sln

      - name: Build Release
        run: dotnet build WorkMate.sln -c Release --no-restore --warnaserror

      - name: Run schedule and stabilization checks
        run: dotnet run --project tests/WorkMate.ScheduleChecks/WorkMate.ScheduleChecks.csproj -c Release --no-build

      # UI Capture is intentionally excluded from the default headless CI job.
